[workspace]
members = ["examples/*"]
resolver = "2"

[package]
name = "waterui-image"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/image"
description = "Image primitives and decode pipeline for WaterUI"
keywords = ["image", "media", "graphics", "waterui"]
categories = ["gui", "multimedia"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = ["gpu"]
# Rasterizing an image into a surface of its own, which is what
# `Image::render_offscreen` does.
#
# Drawing needs none of it: an image describes itself as `Recorder` commands,
# so a consumer whose backend owns the scene — a CPU-only renderer such as a
# dew firmware build — turns this off and links no wgpu, no cherenkov-gpu and
# no rasterizer.
gpu = ["waterui-graphics/gpu"]
# The mounted-runtime tests in `tests/e2e_semantics.rs` and
# `tests/intrinsic_size.rs`. They mount through `waterui-testing`, which pulls
# `hydrolysis` — and no hydrolysis or hydrolysis-m3 revision compiles against
# the pinned waterui revision yet, so the dev-deps below are commented out and
# this is the one piece of the crate that does not build under
# `--all-features`. When a hydrolysis revision lands that implements the new
# `SceneContent` contract, declare the host dev-deps below and this builds.
host-e2e = []

[dependencies]
waterui-core = { version = "0.5.0" }
waterui-graphics = { version = "0.5.0", default-features = false }
waterui-layout = { version = "0.5.0" }
half = { version = "2.7", default-features = false }
num-traits = { version = "0.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
mp4-atom = "0.14.0"

# The AV1 software decoder (rav1d and its colour pipeline) is linked only where
# no platform still-image decoder exists: Android (BitmapFactory), Apple
# (ImageIO) and wasm decode AVIF through the platform.
[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_arch = "wasm32")))'.dependencies]
waterkit-codec = { version = "0.1.4", default-features = false, features = ["software-fallback"] }

[target.'cfg(any(target_os = "android", target_vendor = "apple", target_arch = "wasm32"))'.dependencies]
waterkit-codec = { version = "0.1.4", default-features = false }

[dev-dependencies]
# Dev-deps for the `host-e2e` feature — absent on purpose: `waterui-testing`
# pulls `hydrolysis`, and no hydrolysis or hydrolysis-m3 revision compiles
# against the pinned waterui revision yet (hydrolysis's own Cherenkov port is
# still pinned to an earlier waterui/cherenkov pair), so declaring any of them
# would poison the dev graph for every test target. Restore them, pinned to
# the revision the host port produces, when it lands — together with the
# `hydrolysis`, `hydrolysis-m3` and `vello` patch entries this table used to
# carry for the host:
#
#   waterui = "0.5.0"
#   waterui-testing = "0.5.0"
#   hydrolysis-m3 = "0.3.0"
#   pollster = "1.0"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui `dev`.
[patch.crates-io]
waterui-image = { path = "." }
# The renderer-agnostic fork pins the framework relies on. `block` declares
# the Blocks ABI symbol as real storage; the `xcb` pin is the shared head the
# framework's other crates take.
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }

# nami#26 renamed `Signal::get` to `Signal::snapshot` — a breaking change with
# no compatibility path — so both nami crates this graph names ride the rev
# the framework pins, and the whole graph carries one `Signal` trait.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# The coordinated Cherenkov cutover (water-rs/hydrolysis#205). The recording
# API, engine-owned resources, layers and GPU content all live in the
# cherenkov workspace, which publishes nothing yet; `filtrate`/`filtrate-core`/
# `filtrate-derive` are the members the `.filter(F)` / `.effect(E)` types ride
# on, so every filtrate in the graph must come from this same revision or a
# filter type built on one side is a different type on the other.
cherenkov = { git = "https://github.com/water-rs/cherenkov", rev = "a7708216db67bbf976e1fe36429a6a54cf82ba8a" }
cherenkov-cpu = { git = "https://github.com/water-rs/cherenkov", rev = "a7708216db67bbf976e1fe36429a6a54cf82ba8a" }
cherenkov-gpu = { git = "https://github.com/water-rs/cherenkov", rev = "a7708216db67bbf976e1fe36429a6a54cf82ba8a" }
filtrate = { git = "https://github.com/water-rs/cherenkov", rev = "a7708216db67bbf976e1fe36429a6a54cf82ba8a" }
filtrate-core = { git = "https://github.com/water-rs/cherenkov", rev = "a7708216db67bbf976e1fe36429a6a54cf82ba8a" }
filtrate-derive = { git = "https://github.com/water-rs/cherenkov", rev = "a7708216db67bbf976e1fe36429a6a54cf82ba8a" }

# The framework head the port builds against: water-rs/waterui at
# ad14922997 — the final scene-resource API, where `build_scene` gets a
# per-recording `RecordingResources` and names registrations through it
# (`Registered` is opaque; `Image::replace` is unreachable through it, so a
# new frame registers anew instead of swapping pixels in place). Every
# `waterui-*` crate in the graph must resolve to this one rev — a registry
# `waterui-core` beside the facade's own path dependencies gives two `View`
# traits in one graph.
waterui = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-mcp-protocol = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "ad14922997f28686d04f59f79e84239183524bf7" }

# The extracted component crates the facade and the test graph name: each
# rides the rev the framework's own patch table pins, ported onto the
# cutover — except `waterui-svg`, which sits at the scene-resource port
# itself (water-rs/svg `feat/cherenkov-port`) since the framework's pinned
# rev cannot compile against waterui ad14922997.
waterui-math = { git = "https://github.com/water-rs/math", rev = "f59cc09fd27f2000d36225e72662a653b5751182" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "b3df260fc7a5e723a67805a3bfb3ece56dcd1631" }
waterui-barcode = { git = "https://github.com/water-rs/barcode", rev = "4c530503f6e3277f44511f327db463a195482abd" }
waterui-canvas = { git = "https://github.com/water-rs/canvas", rev = "a024239e18055ac851e639a177d9309ac4a2f821" }
waterui-chart = { git = "https://github.com/water-rs/chart", rev = "ff481c3d319b7d025a1fa0c1dcdb283f92be9689" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", rev = "13e199d255a11637e03341e0a947447851eff85e" }
waterui-video-gpu = { git = "https://github.com/water-rs/video-gpu", rev = "fd554cc95800e42d92b1029c61f641fd9b349465" }
waterui-particle = { git = "https://github.com/water-rs/particle", rev = "e27ae84666ee58c2ff4adae16d9227baf7efc3f2" }

# Every waterkit crate the codec graph shares types across rides the same rev
