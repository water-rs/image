[workspace]
members = ["examples/*"]
resolver = "2"

[package]
name = "waterui-image"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/image"
description = "Image primitives and decode pipeline for WaterUI"
keywords = ["image", "media", "graphics", "waterui"]
categories = ["gui", "multimedia"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = ["gpu"]
# Rasterizing an image into a surface of its own, which is what
# `Image::render_offscreen` does.
#
# Drawing needs none of it: an image describes itself as `Recorder` commands,
# so a consumer whose backend owns the scene — a CPU-only renderer such as a
# dew firmware build — turns this off and links no wgpu, no cherenkov-gpu and
# no rasterizer.
gpu = ["waterui-graphics/gpu"]

[dependencies]
waterui-core = { version = "0.5.0" }
waterui-graphics = { version = "0.5.0", default-features = false }
waterui-layout = { version = "0.5.0" }
half = { version = "2.7", default-features = false }
num-traits = { version = "0.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
mp4-atom = "0.14.0"

# The AV1 software decoder (rav1d and its colour pipeline) is linked only where
# no platform still-image decoder exists: Android (BitmapFactory), Apple
# (ImageIO) and wasm decode AVIF through the platform.
[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_arch = "wasm32")))'.dependencies]
waterkit-codec = { version = "0.2", default-features = false, features = ["software-decode"] }

[target.'cfg(any(target_os = "android", target_vendor = "apple", target_arch = "wasm32"))'.dependencies]
waterkit-codec = { version = "0.2", default-features = false }

[dev-dependencies]
waterui = "0.5.0"
waterui-testing = "0.5.0"
# The layout tests mount a scroll view, whose scrollbars need a widget theme the
# default test theme does not carry.
hydrolysis-m3 = "0.3.0"
pollster = "1.0"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui on `fix/2769-waterkit-0.2`,
# which moves the framework to waterkit 0.2; `Cargo.lock` records the exact
# commit.
[patch.crates-io]
waterui-image = { path = "." }
# The renderer-agnostic fork pins the framework relies on. `block` declares
# the Blocks ABI symbol as real storage; the `xcb` pin is the shared head the
# framework's other crates take.
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }

# suiteki 0.1.1 on crates.io implements nami-core 0.3's `Signal`; suiteki's
# `dev` implements 0.5's (water-rs/suiteki#29), the source the framework's own
# patch table names. Drop once a release carries it.
suiteki = { git = "https://github.com/water-rs/suiteki", branch = "dev" }

# The Cherenkov engine family lives in water-rs/waterui under `graphics/`
# (water-rs/waterui#1449). `filtrate`/`filtrate-core`/`filtrate-derive` are
# the members the `.filter(F)` / `.effect(E)` types ride on, so every filtrate
# in the graph must come from the same framework commit or a filter type built
# on one side is a different type on the other.
cherenkov = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
cherenkov-cpu = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
filtrate = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
filtrate-core = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }

# The framework on the waterui branch named above. Every `waterui-*` crate in
# the graph must resolve to this one source — a registry `waterui-core` beside
# the facade's own path dependencies gives two `View` traits in one graph.
waterui = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-assets = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-controls = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-core = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-form = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-icon = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-internal = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-layout = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-locale = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-macros = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-media = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-shape = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-text = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-url = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-video = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-map = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-mcp-protocol = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-testing = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
waterui-webview = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }

# The extracted component crates the facade and the test graph name, each on
# the source water-rs/waterui's own patch table names on the branch above.
# `waterui-image` itself is the local crate, patched at the top of the table.
waterui-math = { git = "https://github.com/water-rs/math", branch = "feat/nami-0.13" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "16f99e021f735d0b1b31c95552b074e953d56418" }
waterui-barcode = { git = "https://github.com/water-rs/barcode", branch = "feat/nami-0.13" }
waterui-canvas = { git = "https://github.com/water-rs/canvas", branch = "feat/nami-0.13" }
waterui-chart = { git = "https://github.com/water-rs/chart", branch = "feat/nami-0.13" }
waterui-map-gpu = { git = "https://github.com/water-rs/map-gpu", branch = "feat/nami-0.13" }
waterui-video-gpu = { git = "https://github.com/water-rs/video-gpu", branch = "feat/waterkit-0.2" }
waterui-particle = { git = "https://github.com/water-rs/particle", rev = "bf663af85211d1f0bcce511b94ac435efad046a6" }

# WaterKit follows waterkit's `dev`, the source the framework's own patch
# table names, with the exact commit recorded in `Cargo.lock`. Every waterkit
# crate the codec graph shares types across rides the same source — a
# registry `waterkit-core` beside the patched `waterkit-codec` gives two
# decoder types.
waterkit-build = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-audio = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-camera = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-haptic = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-screen = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-container = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-player = { git = "https://github.com/water-rs/waterkit", branch = "dev" }
waterkit-video-streaming = { git = "https://github.com/water-rs/waterkit", branch = "dev" }

# The mounted-test host stack rides the sources the framework's own patch
# table names: `hydrolysis` lives in-tree at `backends/hydrolysis`
# (water-rs/waterui#1428), so it resolves from the same framework source as
# every `waterui-*` crate; its Material 3 theme follows `hydrolysis-m3`'s
# `dev`. The framework's vello fork entries serve only `cherenkov-bench`,
# which this graph does not pull, so they are not repeated here and the graph
# carries no vello.
hydrolysis = { git = "https://github.com/water-rs/waterui", branch = "fix/2769-waterkit-0.2" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", branch = "dev" }

# Mirrored from the water-rs/waterui workspace [patch.crates-io]
# (water-rs/cherenkov#229).
# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). Drop these entries once wgpu-hal 30.0.2
# ships the backport.
naga = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "11e85956a78886d1a96d586f255ea9b0661da2cd" }
