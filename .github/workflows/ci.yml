name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      # `shaderloom` compiles WGSL to DXIL on Windows through `dxc`
      - name: Install DirectX Shader Compiler
        if: runner.os == 'Windows'
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # `*-example` stays out of the `--all-features` pass: its `dev` feature
      # turns on `waterui/dynamic_linking`, which pulls in `waterui-dylib` —
      # a ~77k-symbol DLL that overflows the PE export-table limit of 65535,
      # so the Windows link dies with LNK1189 and that link cannot exist
      # there. Coverage is kept: the second run builds and links every test
      # target the example has on all three OSes with `dev` (its only
      # feature) off, so only the `waterui-dylib` link is left out. The
      # example carries no test functions today, hence `--no-tests warn`
      # instead of the default fail.
      - run: cargo nextest run --workspace --all-targets --all-features --exclude '*-example'
      - run: cargo nextest run -p image-example --all-targets --no-tests warn

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux dependencies
        uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features
