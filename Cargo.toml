[workspace]
members = ["examples/*"]
resolver = "2"

[package]
name = "waterui-image"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/image"
description = "Image primitives and decode pipeline for WaterUI"
keywords = ["image", "media", "graphics", "waterui"]
categories = ["gui", "multimedia"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = ["gpu"]
# Rasterizing an image into a surface of its own, which is what
# `Image::render_offscreen` does and what a `SceneView` falls back to when the
# backend does not merge scenes itself.
#
# Drawing needs none of it: an image describes itself as `Scene2D` commands, so
# a consumer whose backend owns the scene — a CPU-only renderer such as a dew
# firmware build — turns this off and links no wgpu, no Vello and no rasterizer.
gpu = ["waterui-graphics/gpu"]

[dependencies]
waterui-core = { version = "0.5.0" }
waterui-graphics = { version = "0.5.0", default-features = false }
waterui-layout = { version = "0.5.0" }
half = { version = "2.7", default-features = false }
kurbo = "0.13"
peniko = "0.6"
num-traits = { version = "0.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
mp4-atom = "0.14.0"

# The AV1 software decoder (rav1d and its colour pipeline) is linked only where
# no platform still-image decoder exists: Android (BitmapFactory), Apple
# (ImageIO) and wasm decode AVIF through the platform.
[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_arch = "wasm32")))'.dependencies]
waterkit-codec = { version = "0.1.2", default-features = false, features = ["software-fallback"] }

[target.'cfg(any(target_os = "android", target_vendor = "apple", target_arch = "wasm32"))'.dependencies]
waterkit-codec = { version = "0.1.2", default-features = false }

[dev-dependencies]
waterui = "0.5.0"
waterui-testing = "0.5.0"
# The layout tests mount a scroll view, whose scrollbars need a widget theme the
# default test theme does not carry.
hydrolysis-m3 = "0.3.0"
pollster = "1.0"

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui `dev`.
[patch.crates-io]
waterui-image = { path = "." }
# Pinned to the waterkit head that gates the Linux VA-API stack behind a
# `vaapi` feature: a still-image decoder must not link `cros-libva` (see
# water-rs/waterui#1190). Drop this pin once the codec release carries it.
waterkit-codec = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
# The renderer and theme the test graph mounts are their own repositories
# since the extraction; pin the dev heads that carry the proposal-aware
# contract this revision requires.
# The third-party pins below are the framework's own: the pinned
# `waterui-graphics` was built with these forks, and dropping them here would
# render this crate's tests through different code than the framework runs.
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
vello = { git = "https://github.com/lexoliu/vello", rev = "7f5e1ca5769a96dc4404b812e7fa0351499cd2c4" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }

